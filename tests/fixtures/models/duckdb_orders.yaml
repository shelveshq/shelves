model: duckdb_orders
label: DuckDB Orders
description: File-backed order data for DuckDB adapter tests

source:
  type: file
  path: data/orders.csv

dimensions:
  region:
    column: region
    label: Region
  country:
    column: country
    label: Country
  order_date:
    column: "Order Date"
    type: temporal
    label: Order Date
    defaultGrain: month
    format:
      month: "%b %Y"

measures:
  revenue:
    column: revenue
    aggregation: sum
    label: Revenue
    format: "$,.0f"
  cost:
    column: cost
    aggregation: sum
    label: Cost
    format: "$,.0f"
  order_count:
    column: order_count
    aggregation: sum
    label: Order Count
  profit:
    calculation: "{{ revenue }} - {{ cost }}"
    label: Profit
    format: "$,.0f"
  margin:
    calculation: "{{ profit }} / {{ revenue }}"
    label: Margin
    format: ".1%"
