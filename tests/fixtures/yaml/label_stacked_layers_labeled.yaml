sheet: "Revenue & Orders"
data: orders
cols: week
rows:
  - measure: revenue
    mark: bar
    layer:
      - measure: arpu
        mark:
          type: line
          style: dashed
        color: "#666666"
    axis: independent
  - measure: order_count
    mark: bar
label: true
tooltip: [week, revenue, arpu, order_count]
