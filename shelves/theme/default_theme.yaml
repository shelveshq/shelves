# Shelves Default Theme
# Copy this file and pass --theme <path> to customize.

chart:
  background: "#ffffff"
  view:
    fill: "#f8f9fa"
  mark:
    color: "#4A90D9"
  title:
    font: "Inter, system-ui, sans-serif"
    fontSize: 16
    fontWeight: 600
    color: "#1a1a1a"
    subtitleFontSize: 13
    subtitleColor: "#666666"
    subtitleFontWeight: 400
    offset: 24
    anchor: "start"
  # Per-orientation axis defaults (themeable; per-chart axis.x/.y overrides win).
  # Grid is asymmetric (migrated from the old hardcoded encoding default);
  # ruler (domain) and ticks are shown on both axes to preserve today's look.
  axisX:
    grid: false
    domain: true
    ticks: true
  axisY:
    grid: true
    domain: true
    ticks: true
  axis:
    labelFont: "Inter, system-ui, sans-serif"
    labelFontSize: 11
    labelFontWeight: 400
    labelColor: "#1a1a1a"
    titleFont: "Inter, system-ui, sans-serif"
    titleFontSize: 12
    titleFontWeight: 500
    titleColor: "#666666"
    gridColor: "#f0f0f0"
    domainColor: "#9ca3af"
    tickColor: "#9ca3af"
  legend:
    labelFont: "Inter, system-ui, sans-serif"
    labelFontSize: 11
    titleFont: "Inter, system-ui, sans-serif"
    titleFontSize: 12
    padding: 8
  range:
    category:
      - "#4A90D9"
      - "#E5A84B"
      - "#5BBD72"
      - "#D94A6B"
      - "#9B6BD9"
      - "#4AD9C4"
      - "#D97B4A"
      - "#7B8FA1"
  bar:
    cornerRadius: 2
  rect:
    cornerRadius: 2
  padding: 16
  kpi:
    title:
      fontSize: 13
      fontWeight: 500
      color: "#666666"
    value:
      fontSize: 36
      fontWeight: 600
      color: "#1a1a1a"
    comparison:
      fontSize: 12
      fontWeight: 400
    semantic:
      positive: "#16A34A"
      negative: "#DC2626"
      neutral: "#6B7280"
    spacing: 4

layout:
  text:
    primary: "#1a1a1a"
    secondary: "#666666"
    tertiary: "#999999"
  font:
    family:
      body: "Inter, system-ui, sans-serif"
      heading: "Inter, system-ui, sans-serif"
    size:
      xs: 11
      sm: 12
      md: 14
      lg: 18
      xl: 24
    weight:
      normal: 400
      medium: 500
      semibold: 600
      bold: 700
  surface: "#ffffff"
  background: "#f5f5f5"
  border: "#e5e7eb"
  control:
    surface: "#ffffff"
    border: "#e5e7eb"
    radius: 4
    accent: "#4A90D9"
    font_size: 13
    height: 32
    focus_ring: "0 0 0 2px rgba(74, 144, 217, 0.3)"
  presets:
    title:
      font_size: 24
      font_weight: bold
      color: text.primary
      text_align: left
    subtitle:
      font_size: 18
      font_weight: 600
      color: text.secondary
      text_align: left
    heading:
      font_size: 16
      font_weight: 600
      color: text.primary
      text_align: left
    body:
      font_size: 14
      font_weight: normal
      color: text.primary
      text_align: left
    caption:
      font_size: 12
      font_weight: normal
      color: text.tertiary
      text_align: left
    label:
      font_size: 11
      font_weight: 500
      color: text.secondary
      text_align: left
