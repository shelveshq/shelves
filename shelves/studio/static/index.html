<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shelves Studio</title>

  <!-- Vega / Vega-Lite / vega-embed (global scripts for chart rendering).
       Vendored same-origin copies (SHE-77) — a CDN blip or content blocker
       must not be able to break chart rendering. Versions are pinned by
       filename; the canonical list is VEGA_LIB_FILES in shelves/render/to_html.py. -->
  <script src="/static/vendor/vega-5.33.1.min.js"></script>
  <script src="/static/vendor/vega-lite-6.4.3.min.js"></script>
  <script src="/static/vendor/vega-embed-6.29.0.min.js"></script>

  <!-- Label patch (window.labelPatch) — shared with CLI renderer -->
  <script src="/label-patch.js"></script>

  <!-- xterm.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.min.css">

  <!-- Fonts: preconnect only — the font CSS itself is @import'ed once by
       shelves-tokens.css (the DS mirror) below; don't <link> it a second time. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

  <!-- Design-system tokens (source of truth) + Studio bridge — order matters -->
  <link rel="stylesheet" href="/static/shelves-tokens.css">
  <link rel="stylesheet" href="/static/tokens-bridge.css">
  <!-- Styles -->
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Header -->
  <div id="header">
    <div class="sh-header-left">
      <span class="sh-brand-row">
        <svg class="sh-mark" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="8" y="4" width="14" height="4" rx="2" fill="var(--ink-12)"/>
          <rect x="6" y="10" width="8" height="4" rx="2" fill="var(--brand-ochre)"/>
          <rect x="2" y="16" width="12" height="4" rx="2" fill="var(--ink-12)"/>
        </svg>
        <span class="sh-brand">Shelves</span>
      </span>
      <span class="sh-crumb-sep"></span>
      <span class="sh-nav">
        <button id="nav-back" class="sh-nav-btn" title="Back (Cmd/Ctrl+[)" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <button id="nav-forward" class="sh-nav-btn" title="Forward (Cmd/Ctrl+])" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </span>
      <span class="sh-crumb"><span class="sh-crumb-none">no file open</span></span>
    </div>
    <div class="sh-header-right">
      <button class="sh-btn sh-btn-primary">Publish</button>
    </div>
  </div>

  <!-- Main workspace -->
  <div id="workspace">
    <div id="sidebar">
      <div id="sidebar-header">
        <span>Project</span>
        <button id="sidebar-toggle-inner" title="Collapse sidebar (Cmd/Ctrl+B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>
          </svg>
        </button>
      </div>
      <!-- Collapsed rail (SHE-41): a narrow strip that stands in for the
           sidebar when collapsed; clicking it restores the full width. -->
      <div id="sidebar-rail" title="Open file explorer (Cmd/Ctrl+B)" role="button" aria-label="Open file explorer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>
        </svg>
      </div>
      <!-- Pending state from FIRST PAINT (SHE-64): fetchTree swaps it for the
           real tree (or the error/empty placeholder) — never a blank strip. -->
      <div id="file-tree"><div class="tree-placeholder">Loading project&hellip;</div></div>
    </div>
    <div id="sidebar-resize-handle" title="Drag to resize; double-click to reset"></div>
    <div id="editor-pane">
      <div id="editor"></div>
      <!-- Boot veil (SHE-64): removed when Monaco is ready, swapped for an
           error card if the load fails/times out — a guaranteed terminal
           transition either way. The pill fades in after 150ms so a warm
           load never flashes it. -->
      <div id="editor-boot"><span class="sh-boot-pill">Loading editor&hellip;</span></div>
    </div>
    <div id="resize-handle"></div>
    <div id="preview-pane">
      <div class="sh-compiling-pill">Compiling&hellip;</div>
      <div id="preview-header">
        <div style="display:flex;align-items:center">
          <span class="sh-preview-label">Preview</span>
          <span class="sh-preview-ambient"></span>
        </div>
        <div class="sh-preview-right">
          <div id="view-toggles" class="sh-seg">
            <button class="sh-seg-btn is-active" data-view="chart">Chart</button>
            <button class="sh-seg-btn" data-view="data">Data</button>
          </div>
        </div>
      </div>
      <div id="preview">
        <div id="chart-card">
          <div id="chart-container"></div>
        </div>
      </div>
      <div id="dashboard-preview">
        <div id="dashboard-stage">
          <iframe id="dashboard-iframe" sandbox="allow-scripts"></iframe>
        </div>
      </div>
      <div id="data-view"></div>
      <div id="error-overlay"></div>
    </div>
  </div>

  <!-- Terminal Panel -->
  <div id="terminal-panel" class="collapsed">
    <div id="terminal-resize-handle"></div>
    <div id="terminal-header">
      <div id="terminal-tabs"></div>
      <div id="terminal-actions">
        <button id="terminal-new" title="New terminal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5v14"/>
          </svg>
        </button>
        <button id="terminal-toggle" title="Hide terminal (Ctrl+`)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="terminal-container"></div>
  </div>

  <!-- Status Bar -->
  <div id="statusbar">
    <div class="sh-status-left">
      <span class="sh-status-dot"></span>
      <span class="sh-status-msg">No file open</span>
    </div>
    <div class="sh-status-right">
      <button class="sh-status-term" id="terminal-toggle-status" title="Toggle terminal (Ctrl+`)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        Terminal
      </button>
      <span class="sh-status-sep">|</span>
      <span class="sh-status-item">YAML</span>
      <span class="sh-status-sep">&middot;</span>
      <span class="sh-status-item">UTF-8</span>
    </div>
  </div>

  <!-- Command Palette (placeholder) -->
  <div id="command-palette"></div>

  <!-- Application modules -->
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
